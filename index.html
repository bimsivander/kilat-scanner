<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1">

  <title>KILAT QR Scanner</title>


  <script
    src="
      https://unpkg.com/html5-qrcode"
    defer>
  </script>


  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      background:
        linear-gradient(
          145deg,
          #312e81,
          #4f46e5,
          #0891b2
        );
      font-family:
        Arial,
        sans-serif;
      color:#172033;
    }

    .app{
      width:min(520px,100%);
      margin:auto;
      min-height:100vh;
      padding:20px 16px;
    }

    .header{
      color:white;
      margin-bottom:18px;
    }

    .logo{
      width:52px;
      height:52px;
      border-radius:16px;
      background:
        rgba(255,255,255,.16);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      font-weight:900;
      margin-bottom:12px;
    }

    h1{
      margin:0;
      font-size:25px;
    }

    .subtitle{
      margin-top:5px;
      opacity:.8;
      font-size:12px;
    }

    .card{
      background:white;
      border-radius:26px;
      padding:18px;
      box-shadow:
        0 20px 60px
        rgba(0,0,0,.20);
    }

    .session{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-bottom:14px;
    }

    .info{
      background:#f8fafc;
      border-radius:14px;
      padding:11px;
    }

    .label{
      font-size:9px;
      color:#718096;
      font-weight:bold;
      margin-bottom:4px;
    }

    .value{
      font-size:11px;
      font-weight:800;
    }

    #reader{
      width:100%;
      overflow:hidden;
      border-radius:18px;
      border:0 !important;
    }

    button{
      width:100%;
      border:0;
      border-radius:14px;
      padding:14px;
      margin-top:12px;
      background:#4f46e5;
      color:white;
      font-weight:800;
      cursor:pointer;
    }

    .result{
      margin-top:14px;
      padding:13px;
      border-radius:14px;
      background:#f1f5f9;
      font-size:11px;
      line-height:1.5;
    }

    .hint{
      text-align:center;
      color:#718096;
      font-size:10px;
      margin-top:14px;
    }

  </style>

</head>


<body>


<div class="app">


  <div class="header">

    <div class="logo">
      K
    </div>

    <h1>
      KILAT QR Scanner
    </h1>

    <div class="subtitle">
      SMAN 2 Payakumbuh
    </div>

  </div>


  <div class="card">


    <div class="session">

      <div class="info">

        <div class="label">
          KELAS
        </div>

        <div
          class="value"
          id="classText">
          -
        </div>

      </div>


      <div class="info">

        <div class="label">
          TANGGAL
        </div>

        <div
          class="value"
          id="dateText">
          -
        </div>

      </div>


      <div class="info">

        <div class="label">
          SESI
        </div>

        <div
          class="value"
          id="sessionText">
          -
        </div>

      </div>


      <div class="info">

        <div class="label">
          STATUS
        </div>

        <div
          class="value"
          id="statusText">
          Siap scan
        </div>

      </div>

    </div>


    <div id="reader"></div>


    <button
      onclick="startCamera()">

      📷 Mulai Kamera

    </button>


    <button
      onclick="stopCamera()"
      style="
        background:#e2e8f0;
        color:#334155;
      ">

      Hentikan Kamera

    </button>


    <div
      id="result"
      class="result">

      Arahkan kamera ke QR Code siswa.

    </div>


    <div class="hint">

      QR siswa berisi SiswaID KILAT.

    </div>


  </div>

</div>


<script>

let scanner = null;

let scanning = false;


const params =
  new URLSearchParams(
    window.location.search
  );


const API =
  params.get('api') || '';

const TOKEN =
  params.get('token') || '';

const KELAS =
  params.get('kelasId') || '';

const TANGGAL =
  params.get('tanggal') || '';

const MAPEL =
  params.get('mapelId') || '';

const SESI =
  params.get('sesiId') || '';


document
  .getElementById('classText')
  .textContent =
    KELAS || '-';


document
  .getElementById('dateText')
  .textContent =
    TANGGAL || '-';


document
  .getElementById('sessionText')
  .textContent =
    SESI || '-';


function setStatus(text){

  document
    .getElementById(
      'statusText'
    )
    .textContent =
      text;
}


function setResult(text){

  document
    .getElementById(
      'result'
    )
    .textContent =
      text;
}


function startCamera(){

  if(!API){

    setResult(
      'URL Apps Script belum diberikan.'
    );

    return;
  }


  if(!TOKEN){

    setResult(
      'Sesi login tidak ditemukan. Kembali ke aplikasi KILAT.'
    );

    return;
  }


  if(scanning)
    return;


  scanner =
    new Html5Qrcode(
      'reader'
    );


  scanner
    .start(

      {
        facingMode:
          'environment'
      },

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        }

      },

      function(decodedText){

        onScan(decodedText);

      },

      function(errorMessage){

        // Error pembacaan frame diabaikan.
      }

    )
    .then(function(){

      scanning = true;

      setStatus(
        'Kamera aktif'
      );

      setResult(
        'Arahkan kamera ke QR siswa.'
      );

    })
    .catch(function(error){

      setResult(
        'Kamera tidak dapat dibuka: ' +
        error
      );

    });
}


function stopCamera(){

  if(
    scanner &&
    scanning
  ){

    scanner
      .stop()
      .then(function(){

        scanning = false;

        setStatus(
          'Kamera berhenti'
        );

      })
      .catch(function(){});

  }
}


function onScan(studentId){

  if(!studentId)
    return;


  setStatus(
    'QR terbaca'
  );


  setResult(
    'Memproses absensi siswa ' +
    studentId +
    '...'
  );


  stopCamera();


  const query = [

    'action=scan',

    'token=' +
      encodeURIComponent(TOKEN),

    'studentId=' +
      encodeURIComponent(
        studentId
      ),

    'kelasId=' +
      encodeURIComponent(KELAS),

    'tanggal=' +
      encodeURIComponent(TANGGAL),

    'mapelId=' +
      encodeURIComponent(MAPEL),

    'sesiId=' +
      encodeURIComponent(SESI)

  ].join('&');


  window.location.href =
    API +
    '?' +
    query;
}

</script>


</body>

</html>
