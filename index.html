<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KILAT QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;font-family:Inter,system-ui;background:#07111f;color:#fff;min-height:100vh}.wrap{width:min(520px,100%);margin:auto;padding:18px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.logo{width:42px;height:42px;border-radius:13px;background:#2563eb;display:grid;place-items:center;font-size:22px}.card{background:#101d30;border:1px solid #22334b;border-radius:22px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;font-size:12px;color:#9fb0c7}.field input,.field select{padding:11px;border-radius:10px;border:1px solid #31435e;background:#0b1626;color:#fff}.scan{background:#fff;border-radius:18px;padding:10px;color:#111}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;background:#2563eb;color:#fff;margin-top:10px}.result{padding:12px;border-radius:12px;background:#0b1626}.muted{color:#9fb0c7;font-size:12px}
</style>
</head>
<body><div class="wrap">
<div class="brand"><div class="logo">⚡</div><div><b>KILAT QR SCANNER</b><div class="muted">SMAN 2 Payakumbuh</div></div></div>
<div class="card"><div class="grid"><label class="field">Tanggal<input id="date" type="date" readonly></label><label class="field">Kelas<input id="className" readonly></label><label class="field">Mata Pelajaran<input id="subjectName" readonly></label><label class="field">Sesi<input id="sessionLabel" readonly></label></div><div class="muted" style="margin-top:10px">Konteks absensi dikirim otomatis dari KILAT. Tidak perlu memilih kelas lagi di scanner.</div></div><div class="card"><div class="scan" id="reader"></div><button class="btn" id="start">Mulai Kamera</button><button class="btn" id="finish" style="background:#16a34a" disabled>Selesai & Kembali ke KILAT</button></div>
<div class="card"><div class="muted">HASIL SCAN</div><div id="result" class="result">Belum ada QR yang dipindai.</div><div id="scanList" class="result" style="margin-top:10px;max-height:220px;overflow:auto">0 siswa tercatat.</div></div>
</div>
<script>
const p=new URLSearchParams(location.search);
document.getElementById('date').value=p.get('date')||new Date().toISOString().slice(0,10);
document.getElementById('className').value=p.get('className')||p.get('classId')||'Belum dipilih dari KILAT';
document.getElementById('subjectName').value=p.get('subjectName')||p.get('subjectId')||'Belum dipilih dari KILAT';
document.getElementById('sessionLabel').value=p.get('sessionLabel')||p.get('sessionId')||'Belum dipilih dari KILAT';
let scanner=null,scans=[],scanLock=false;
function updateList(){
 const box=document.getElementById('scanList');
 box.innerHTML=scans.length?scans.map((x,i)=>`${i+1}. ${String(x.student_code||x.qr_token||'QR')}`).join('<br>'):'0 siswa tercatat.';
 document.getElementById('finish').disabled=!scans.length;
}
async function onScan(text){
 if(scanLock)return;
 scanLock=true;
 try{
  let data;try{data=JSON.parse(text)}catch(e){data={student_code:text}}
  const payload={...data,date:document.getElementById('date').value,class_id:p.get('classId')||'',subject_id:p.get('subjectId')||'',session_id:p.get('sessionId')||''};
  if(!payload.student_code&&!payload.qr_token)throw new Error('QR tidak berisi identitas siswa.');
  if(!payload.session_id)throw new Error('Sesi absensi tidak ditemukan.');
  const key=String(payload.student_code||payload.qr_token);
  if(!scans.some(x=>String(x.student_code||x.qr_token)===key)){
   scans.push(payload);updateList();
   document.getElementById('result').textContent='Berhasil membaca: '+key+' — kamera tetap aktif.';
  }else{
   document.getElementById('result').textContent='QR '+key+' sudah dipindai; silakan scan siswa berikutnya.';
  }
 }catch(e){document.getElementById('result').textContent='Scan gagal: '+(e.message||e)}
 finally{setTimeout(()=>scanLock=false,900)}
}
document.getElementById('start').onclick=async()=>{
 if(scanner)return;
 scanner=new Html5Qrcode('reader');
 try{
  await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:260}},onScan,()=>{});
  document.getElementById('start').textContent='Kamera aktif — scan siswa';
  document.getElementById('start').disabled=true;
 }catch(e){scanner=null;document.getElementById('result').textContent='Kamera tidak dapat dibuka: '+e}
};
document.getElementById('finish').onclick=async()=>{
 if(!scans.length){document.getElementById('result').textContent='Belum ada siswa yang dipindai.';return;}
 const returnUrl=p.get('returnUrl');
 if(!returnUrl){document.getElementById('result').textContent='URL kembali ke KILAT tidak ditemukan.';return;}
 try{
  if(scanner){try{await scanner.stop()}catch(e){}scanner=null;}
  const payload={type:'KILAT_SCAN_RESULT',date:document.getElementById('date').value,class_id:p.get('classId')||'',subject_id:p.get('subjectId')||'',session_id:p.get('sessionId')||'',scans:scans};
  let sent=false;
  if(window.opener&&!window.opener.closed){
    try{
      const targetOrigin=new URL(returnUrl).origin;
      window.opener.postMessage(payload,targetOrigin);
      sent=true;
      document.getElementById('result').textContent='Hasil scan dikirim ke KILAT. Menutup scanner...';
      setTimeout(()=>window.close(),350);
    }catch(e){}
  }
  if(!sent){
    const u=new URL(returnUrl);
    u.searchParams.set('scanBatch',encodeURIComponent(JSON.stringify(scans)));
    location.href=u.toString();
  }
 }catch(e){document.getElementById('result').textContent='Gagal kembali ke KILAT: '+(e.message||e)}
};
updateList();
</script>
</body></html>
