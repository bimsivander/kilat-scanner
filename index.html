<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KILAT QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;font-family:Inter,system-ui;background:#07111f;color:#fff;min-height:100vh}.wrap{width:min(520px,100%);margin:auto;padding:18px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.logo{width:42px;height:42px;border-radius:13px;background:#2563eb;display:grid;place-items:center;font-size:22px}.card{background:#101d30;border:1px solid #22334b;border-radius:22px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;font-size:12px;color:#9fb0c7}.field input,.field select{padding:11px;border-radius:10px;border:1px solid #31435e;background:#0b1626;color:#fff}.scan{background:#fff;border-radius:18px;padding:10px;color:#111}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;background:#2563eb;color:#fff;margin-top:10px}.result{padding:12px;border-radius:12px;background:#0b1626}.muted{color:#9fb0c7;font-size:12px}
</style>
</head>
<body><div class="wrap">
<div class="brand"><div class="logo">⚡</div><div><b>KILAT QR SCANNER</b><div class="muted">SMAN 2 Payakumbuh</div></div></div>
<div class="card"><div class="grid"><label class="field">Tanggal<input id="date" type="date" readonly></label><label class="field">Kelas<input id="className" readonly></label><label class="field">Mata Pelajaran<input id="subjectName" readonly></label><label class="field">Sesi<input id="sessionLabel" readonly></label></div><div class="muted" style="margin-top:10px">Konteks absensi dikirim otomatis dari KILAT. Tidak perlu memilih kelas lagi di scanner.</div></div><div class="card"><div class="scan" id="reader"></div><button class="btn" id="start">Mulai Kamera</button><button class="btn" id="manualBtn" style="background:#475569">Absensi Manual</button><button class="btn" id="finish" style="background:#16a34a" disabled>Selesai & Kembali ke KILAT</button></div><div class="card" id="manualCard" style="display:none"><div class="muted">ABSENSI MANUAL</div><input id="manualSearch" class="field" placeholder="Cari nama siswa..." style="width:100%;box-sizing:border-box;margin:10px 0"><div id="manualList" class="result" style="max-height:260px;overflow:auto"></div></div>
<div class="card"><div class="muted">HASIL SCAN</div><div id="result" class="result">Belum ada QR yang dipindai.</div><div id="scanList" class="result" style="margin-top:10px;max-height:220px;overflow:auto">0 siswa tercatat.</div></div>
</div>
<script>
const p=new URLSearchParams(location.search);
const date=document.getElementById('date');
date.value=p.get('date')||'';
document.getElementById('className').value=p.get('className')||p.get('classId')||'Belum dipilih dari KILAT';
document.getElementById('subjectName').value=p.get('subjectName')||p.get('subjectId')||'Belum dipilih dari KILAT';
document.getElementById('sessionLabel').value=p.get('sessionLabel')||p.get('sessionId')||'Belum dipilih dari KILAT';
let scanner=null,scans=[],scanLock=false;
let students=[];try{students=JSON.parse(p.get('students')||'[]')}catch(e){students=[]}
const returnUrl=p.get('returnUrl')||'';
const targetOrigin=p.get('scannerOrigin')||((()=>{try{return new URL(returnUrl).origin}catch(e){return ''}})());
function updateList(){
 const box=document.getElementById('scanList');
 box.innerHTML=scans.length?scans.map((x,i)=>`${i+1}. ${String(x.full_name||x.student_code||x.qr_token||'QR')} <small>(${String(x.method||'QR')})</small>`).join('<br>'):'0 siswa tercatat.';
 document.getElementById('finish').disabled=!scans.length;
}
function manualList(){
 const q=(document.getElementById('manualSearch').value||'').toLowerCase().trim();
 const box=document.getElementById('manualList');
 const rows=students.filter(x=>!q||String(x.full_name||'').toLowerCase().includes(q)||String(x.student_code||'').toLowerCase().includes(q)||String(x.nis||'').toLowerCase().includes(q));
 box.innerHTML=rows.length?rows.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #22334b"><span><b>${String(x.full_name||'')}</b><br><small>${String(x.student_code||'')}${x.nis?' • NIS '+String(x.nis):''}</small></span><button class="btn" style="width:auto;margin:0;padding:8px 12px" onclick="manualAttend('${String(x.student_id).replace(/'/g,"\\'")}')">HADIR</button></div>`).join(''):'Siswa tidak ditemukan.';
}
function postToKilat(payload,waitForAck=true,timeoutMs=30000){
 if(!window.opener||window.opener.closed||!targetOrigin)return Promise.resolve(false);
 try{
   return new Promise(resolve=>{
     let done=false;
     const finish=v=>{if(done)return;done=true;window.removeEventListener('message',onAck);clearTimeout(timer);resolve(v)};
     const timer=setTimeout(()=>finish(false),timeoutMs);
     function onAck(e){
       const d=e.data;
       if(e.origin!==targetOrigin||e.source!==window.opener||!d||d.type!=='KILAT_SCAN_ACK'||d.requestId!==payload.requestId)return;
       finish(d.success===true);
     }
     if(waitForAck)window.addEventListener('message',onAck);
     window.opener.postMessage(payload,targetOrigin);
     if(!waitForAck)finish(true);
   });
 }catch(e){return Promise.resolve(false)}
}
async function manualAttend(studentId){
 const st=students.find(x=>String(x.student_id)===String(studentId));if(!st)return;
 const already=scans.find(x=>String(x.student_id)===String(studentId));
 if(already){document.getElementById('result').textContent=st.full_name+' sudah ada di daftar '+String(already.method||'QR')+'.';return;}
 const item={student_id:st.student_id,student_code:st.student_code,nis:st.nis||'',full_name:st.full_name,date:date.value,class_id:p.get('classId')||'',subject_id:p.get('subjectId')||'',session_id:p.get('sessionId')||'',method:'MANUAL',status:'HADIR'};
 document.getElementById('result').textContent='Mengirim absensi manual ke KILAT...';
 // Untuk satu absensi manual, gunakan returnUrl sebagai jalur utama.
 // Ini tidak bergantung pada window.opener/postMessage dan langsung diproses oleh KILAT.
 try{
   const u=new URL(returnUrl);
   u.searchParams.set('scanBatch',JSON.stringify([item]));
   location.href=u.toString();
   return;
 }catch(e){
   document.getElementById('result').textContent='Absensi manual gagal dikirim ke KILAT: '+(e.message||e);
   return;
 }
}
async function onScan(text){
 if(scanLock)return;scanLock=true;
 try{
  let data;try{data=JSON.parse(text)}catch(e){data={student_code:text}}
  const payload={...data,date:date.value,class_id:p.get('classId')||'',subject_id:p.get('subjectId')||'',session_id:p.get('sessionId')||'',method:'QR'};
  if(!payload.student_code&&!payload.qr_token)throw new Error('QR tidak berisi identitas siswa.');
  if(!payload.session_id)throw new Error('Sesi absensi tidak ditemukan.');
  const key=String(payload.student_code||payload.qr_token);
  if(!scans.some(x=>String(x.student_code||x.qr_token)===key)){
    const known=students.find(x=>String(x.student_code)===String(payload.student_code));
    if(known){payload.student_id=known.student_id;payload.full_name=known.full_name;}
    scans.push(payload);updateList();document.getElementById('result').textContent='Berhasil membaca: '+key+' — kamera tetap aktif.';
  }else document.getElementById('result').textContent='QR '+key+' sudah dipindai; silakan scan siswa berikutnya.';
 }catch(e){document.getElementById('result').textContent='Scan gagal: '+(e.message||e)}
 finally{setTimeout(()=>scanLock=false,900)}
}
document.getElementById('start').onclick=async()=>{
 if(scanner)return;scanner=new Html5Qrcode('reader');
 try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:260}},onScan,()=>{});document.getElementById('start').textContent='Kamera aktif — scan siswa';document.getElementById('start').disabled=true}
 catch(e){scanner=null;document.getElementById('result').textContent='Kamera tidak dapat dibuka: '+e}
};
document.getElementById('manualBtn').onclick=()=>{const c=document.getElementById('manualCard');c.style.display=c.style.display==='none'?'block':'none';manualList()};
document.getElementById('manualSearch').oninput=manualList;
document.getElementById('finish').onclick=async()=>{
 if(!returnUrl){document.getElementById('result').textContent='URL kembali ke KILAT tidak ditemukan.';return;}
 if(!scans.length){document.getElementById('result').textContent='Belum ada siswa yang dipindai.';return;}
 const finishBtn=document.getElementById('finish');finishBtn.disabled=true;finishBtn.textContent='Mengirim hasil ke KILAT...';
 try{
  if(scanner){try{await scanner.stop()}catch(e){}scanner=null;}
  const payload={type:'KILAT_SCAN_RESULT',requestId:'REQ-'+Date.now()+'-'+Math.random().toString(36).slice(2),date:date.value,class_id:p.get('classId')||'',subject_id:p.get('subjectId')||'',session_id:p.get('sessionId')||'',scans:scans};
  console.log('Scanner sending batch:',{count:scans.length,date:payload.date,class_id:payload.class_id,subject_id:payload.subject_id,session_id:payload.session_id});
  if(await postToKilat(payload,true,30000)){document.getElementById('result').textContent='KILAT menerima '+scans.length+' hasil. Menutup scanner...';setTimeout(()=>window.close(),350);return;}
  const u=new URL(returnUrl);u.searchParams.set('scanBatch',JSON.stringify(scans));location.href=u.toString();
 }catch(e){finishBtn.disabled=false;finishBtn.textContent='Selesai & Kembali ke KILAT';document.getElementById('result').textContent='Gagal kembali ke KILAT: '+(e.message||e)}
};
updateList();manualList();
</script>
</body></html>
